<div class="shell">
  <aside class="side" id="side"><div class="brand"><div class="logo">🏗️</div><div><b>Obra Fácil</b><small>Gestão de obras</small></div></div><div class="nav" id="nav"></div></aside>
  <main class="main"><header class="top"><button class="menu" id="menu">☰</button><div><h1 id="title">Visão geral</h1><small id="subtitle">Gestão da obra</small></div><select id="obraSelect"></select></header><div class="content" id="app"></div></main>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL='https://dnvxvufknalpkkyttjcp.supabase.co';
const SUPABASE_KEY='sb_publishable_vuWxPsbP4CeHkekJkL-P6g_Jy3kOYcZ';
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});

const today=new Date().toISOString().slice(0,10);
const money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(+v||0);
const date=v=>v?new Date(v+'T12:00:00').toLocaleDateString('pt-BR'):'—';
let data={obras:[],materiais:[],trabalhadores:[],mao:[],tarefas:[],diario:[]};
let obraId='',page='dashboard',session=null,channel=null,loading=false;
const pages=[['dashboard','Início','🏠'],['obras','Obras','🏢'],['materiais','Materiais','📦'],['mao','Equipe','👷'],['cronograma','Agenda','📅'],['diario','Diário','📝'],['kanban','Status','📋'],['relatorios','Resumo','📊']];
const byObra=k=>data[k].filter(x=>x.obra_id===obraId);
const obra=()=>data.obras.find(x=>x.id===obraId)||data.obras[0];
const esc=s=>String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
function status(s){const c=s==='Concluída'||s==='Recebido'?'done':s==='Em andamento'?'run':s==='Atrasada'?'late':'';return `<span class="status ${c}">${esc(s)}</span>`}
function uniq(a){return [...new Set(a.filter(Boolean).map(v=>String(v).trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'))}
function placeholderFor(key,label){
  const map={
    nome:'Ex.: Reforma da Padaria Central',
    cliente:'Ex.: João / Empresa XYZ',
    endereco:'Ex.: Maranguape - CE',
    codigo:'Ex.: MAT-001',
    categoria:'Ex.: Elétrica, Alvenaria, Hidráulica',
    descricao:'Ex.: Cimento CP II 50 kg',
    unidade:'Ex.: un, m, m², saco',
    fornecedor:'Ex.: Depósito São José',
    funcao:'Ex.: Pedreiro, Eletricista, Servente',
    atividade:'Ex.: Levantar parede do setor A',
    etapa:'Ex.: Fundação, Estrutura, Acabamento',
    responsavel:'Ex.: João da Silva',
    atividades_realizadas:'Descreva resumidamente o que foi executado',
    equipe_presente:'Ex.: João, Carlos e Pedro',
    observacoes:'Observações importantes da atividade',
    orcamento_geral:'Ex.: 25000',
    valor_base:'Ex.: 180',
    valor_refeicao:'Ex.: 25',
    transporte_outros:'Ex.: 20'
  };
  return map[key]||('Digite '+String(label||'').toLowerCase());
}
function smart(kind){
  const map={
    cliente:()=>uniq(data.obras.map(x=>x.cliente)),
    endereco:()=>uniq(data.obras.map(x=>x.endereco)),
    categoria:()=>uniq(data.materiais.map(x=>x.categoria)),
    unidade:()=>uniq(data.materiais.map(x=>x.unidade)),
    fornecedor:()=>uniq(data.materiais.map(x=>x.fornecedor)),
    etapa:()=>uniq(byObra('tarefas').map(x=>x.etapa).concat(byObra('diario').map(x=>x.etapa))),
    responsavel:()=>uniq(byObra('trabalhadores').map(x=>x.nome).concat(byObra('tarefas').map(x=>x.responsavel))),
    atividade:()=>uniq(byObra('tarefas').map(x=>x.atividade).concat(byObra('mao').map(x=>x.atividade))),
    funcao:()=>uniq(data.trabalhadores.map(x=>x.funcao))
  };
  return map[kind]?map[kind]():[];
}
function setBusy(v){loading=v;document.body.style.cursor=v?'progress':''}
function toast(msg,err=false){let n=document.querySelector('#toast');if(!n){n=document.createElement('div');n.id='toast';Object.assign(n.style,{position:'fixed',right:'16px',bottom:'78px',zIndex:100,padding:'12px 14px',borderRadius:'10px',maxWidth:'360px',boxShadow:'0 8px 30px #0002',font:'600 13px system-ui'});document.body.appendChild(n)}n.textContent=msg;n.style.background=err?'#ffe8e8':'#eaf7f1';n.style.color=err?'#a02c2c':'#21694a';n.style.display='block';clearTimeout(n._t);n._t=setTimeout(()=>n.style.display='none',3500)}

async function renderPublicShare(token){
  document.querySelector('.shell').style.display='none';
  const {data:shared,error}=await supabase.rpc('get_cronograma_compartilhado',{p_token:token});
  let el=document.querySelector('#publicShare');
  if(!el){el=document.createElement('div');el.id='publicShare';document.body.appendChild(el)}
  if(error||!shared){el.innerHTML='<div class="public-wrap"><section class="panel"><div class="empty">Link inválido ou compartilhamento desativado.</div></section></div>';return}
  const o=shared.obra||{},t=shared.atividades||[];
  const prog=t.length?Math.round(t.reduce((s,x)=>s+(+x.percentual_concluido||0),0)/t.length):0;
  const late=t.filter(x=>x.fim_previsto&&x.fim_previsto<today&&x.status!=='Concluída').length;
  const etapas=[...new Set(t.map(x=>x.etapa||'Sem etapa'))];
  el.innerHTML=`<div class="public-wrap">
    <div class="public-head"><small>ACOMPANHAMENTO DA OBRA</small><h2 style="margin:4px 0">${esc(o.nome||'Obra')}</h2><div>${esc(o.cliente||'')} • ${date(o.data_inicio_prevista)} → ${date(o.data_fim_prevista)}</div></div>
    <div class="grid4">${card('Evolução',prog+'%')}${card('Atividades',String(t.length))}${card('Atrasadas',String(late))}${card('Status',esc(o.status||'—'))}</div>
    <section class="panel"><div class="panel-head"><h2>Etapas</h2><span class="status">Somente leitura</span></div>
    ${etapas.length?etapas.map(e=>{const a=t.filter(x=>(x.etapa||'Sem etapa')===e),p=Math.round(a.reduce((s,x)=>s+(+x.percentual_concluido||0),0)/a.length);return `<div class="row"><div style="flex:1"><b>${esc(e)}</b><div class="progress"><i style="width:${p}%"></i></div></div><b>${p}%</b></div>`}).join(''):empty('Nenhuma etapa cadastrada.')}</section>
    <section class="panel"><div class="panel-head"><h2>Cronograma</h2></div>
    ${t.length?t.map(x=>`<div class="timeline-card"><div class="timeline-top"><div><small>${esc(x.etapa||'')}</small><b>${esc(x.atividade)}</b><small>${esc(x.responsavel||'')} • ${date(x.inicio_previsto)} → ${date(x.fim_previsto)}</small></div>${status(x.fim_previsto&&x.fim_previsto<today&&x.status!=='Concluída'?'Atrasada':x.status)}</div><div class="range-row"><div class="progress"><i style="width:${x.percentual_concluido}%"></i></div><b>${x.percentual_concluido}%</b></div></div>`).join(''):empty('Nenhuma atividade cadastrada.')}</section>
  </div>`;
}
function authScreen(message=''){
  document.querySelector('.shell').style.display='none';
  let el=document.querySelector('#auth');
  if(!el){el=document.createElement('div');el.id='auth';document.body.appendChild(el)}
  el.innerHTML=`<div style="min-height:100vh;display:grid;place-items:center;padding:20px;background:#f3f5f7"><div style="width:min(430px,100%);background:white;border:1px solid #e1e6ec;border-radius:18px;padding:24px;box-shadow:0 10px 40px #17203012"><div style="display:flex;align-items:center;gap:12px;margin-bottom:20px"><div class="logo">🏗️</div><div><h2 style="margin:0">Obra Fácil</h2><small style="color:#7b8794">Gestão de obras em tempo real</small></div></div>${message?`<div class="notice">${esc(message)}</div>`:''}<form id="loginForm" style="display:grid;gap:12px;margin-top:14px"><label class="field"><span>E-mail</span><input name="email" type="email" required autocomplete="email"></label><label class="field"><span>Senha</span><input name="password" type="password" minlength="6" required autocomplete="current-password"></label><button class="btn primary" type="submit">Entrar</button><button class="btn secondary" type="button" id="signup">Criar conta</button></form></div></div>`;
  document.querySelector('#loginForm').onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target).entries());setBusy(true);const {error}=await supabase.auth.signInWithPassword({email:v.email,password:v.password});setBusy(false);if(error)toast(error.message,true)};
  document.querySelector('#signup').onclick=async()=>{const f=document.querySelector('#loginForm');const v=Object.fromEntries(new FormData(f).entries());if(!v.email||!v.password)return toast('Informe e-mail e senha.',true);setBusy(true);const {data:d,error}=await supabase.auth.signUp({email:v.email,password:v.password});setBusy(false);if(error)return toast(error.message,true);if(!d.session)authScreen('Conta criada. Verifique seu e-mail para confirmar o cadastro e depois faça login.');else toast('Conta criada com sucesso!')};
}
function showApp(){document.querySelector('#auth')?.remove();document.querySelector('.shell').style.display='block'}

async function loadData(){if(!session)return;setBusy(true);const qs=await Promise.all([
  supabase.from('obras').select('*').order('created_at',{ascending:true}),
  supabase.from('materiais').select('*').order('created_at',{ascending:true}),
  supabase.from('trabalhadores').select('*').order('created_at',{ascending:true}),
  supabase.from('mao_obra_registros').select('*').order('data',{ascending:false}),
  supabase.from('atividades').select('*').order('created_at',{ascending:true}),
  supabase.from('diario_obra').select('*').order('data',{ascending:false})
]);setBusy(false);
  const err=qs.find(x=>x.error)?.error;if(err){toast('Erro ao carregar dados: '+err.message,true);return}

    const st=e.target.value,patch={status:st};
    if(st==='Concluída')patch.percentual_concluido=100;
    const {error}=await supabase.from('atividades').update(patch).eq('id',e.target.dataset.statusId).eq('obra_id',obraId);
    if(error)toast(error.message,true);else toast('Status desta obra atualizado')
  });
}
function diario(){if(needObra())return;const d=byObra('diario');document.querySelector('#app').innerHTML=`<section class="panel"><div class="panel-head"><h2>Diário da obra</h2><button class="btn primary" id="add">+ Registro</button></div>${d.length?d.map(x=>`<div class="row"><div><small>${date(x.data)} • ${esc(x.etapa||'')}</small><b>${esc(x.atividades_realizadas||'')}</b><small>${esc(x.equipe_presente||'')} • Responsável: ${esc(x.responsavel||'—')}</small></div><b>+${x.avanco_dia||0}%</b></div>`).join(''):empty('Nenhum registro diário.')}</section>`;document.querySelector('#add').onclick=()=>openForm('Novo registro',[['data','Data','date'],['etapa','Etapa','smart','etapa'],['atividades_realizadas','Atividades realizadas','textarea'],['equipe_presente','Equipe presente','smart','responsavel'],['avanco_dia','Avanço do dia (%)','number'],['responsavel','Responsável','smart','responsavel'],['observacoes','Observações','textarea']],async v=>{v.obra_id=obraId;v.avanco_dia=Math.max(0,Math.min(100,+v.avanco_dia||0));const {error}=await supabase.from('diario_obra').insert(v);if(error)throw error})}
function kanban(){if(needObra())return;const t=byObra('tarefas'),cols=['Não iniciada','Em andamento','Pausada','Concluída'];document.querySelector('#app').innerHTML=`<div class="kanban">${cols.map(c=>`<div class="col"><h3>${c} (${t.filter(x=>x.status===c).length})</h3>${t.filter(x=>x.status===c).map(x=>`<div class="task"><small>${esc(x.etapa||'')}</small><b>${esc(x.atividade)}</b><small>${esc(x.responsavel||'')}</small><div class="progress"><i style="width:${x.percentual_concluido}%"></i></div><select data-task="${x.id}">${cols.map(k=>`<option ${k===x.status?'selected':''}>${k}</option>`).join('')}</select></div>`).join('')}</div>`).join('')}</div>`;document.querySelectorAll('[data-task]').forEach(s=>s.onchange=async e=>{const st=e.target.value,patch={status:st};if(st==='Concluída')patch.percentual_concluido=100;const {error}=await supabase.from('atividades').update(patch).eq('id',e.target.dataset.task);if(error)toast(error.message,true)})}
function relatorios(){if(needObra())return;const m=byObra('materiais'),l=byObra('mao'),t=byObra('tarefas');const mp=m.reduce((s,x)=>s+(+x.qtd_prevista||0)*(+x.preco_orcado_unit||0),0),mr=m.reduce((s,x)=>s+(+x.qtd_comprada||0)*(+x.preco_pago_unit||0)+(+x.frete_outros||0),0),mo=l.reduce((s,x)=>s+(+x.valor_mao_obra||0),0),al=l.reduce((s,x)=>s+(+x.qtd_refeicoes||0)*(+x.valor_refeicao||0),0),ot=l.reduce((s,x)=>s+(+x.transporte_outros||0),0),tot=mr+mo+al+ot,prog=t.length?Math.round(t.reduce((s,x)=>s+(+x.percentual_concluido||0),0)/t.length):0;document.querySelector('#app').innerHTML=`<section class="panel"><div class="panel-head"><h2>Resumo financeiro</h2><button class="btn secondary" id="csv">Exportar CSV</button></div><div class="report"><div><span>Orçamento geral</span><b>${money(obra()?.orcamento_geral)}</b></div><div><span>Gasto registrado</span><b>${money(tot)}</b></div><div><span>Saldo estimado</span><b>${money((obra()?.orcamento_geral||0)-tot)}</b></div><div><span>Progresso físico</span><b>${prog}%</b></div></div></section><div class="two"><section class="panel"><h2>Previsto x realizado</h2><div class="row"><span>Materiais previstos</span><b>${money(mp)}</b></div><div class="row"><span>Materiais realizados</span><b>${money(mr)}</b></div><div class="row"><span>Diferença</span><b>${money(mr-mp)}</b></div></section><section class="panel"><h2>Custos realizados</h2><div class="row"><span>Mão de obra</span><b>${money(mo)}</b></div><div class="row"><span>Alimentação</span><b>${money(al)}</b></div><div class="row"><span>Transporte/outros</span><b>${money(ot)}</b></div></section></div>`;document.querySelector('#csv').onclick=()=>{const csv='Categoria,Valor\nMateriais,'+mr+'\nMão de obra,'+mo+'\nAlimentação,'+al+'\nTransporte/outros,'+ot+'\nTotal,'+tot;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='obra-facil-relatorio.csv';a.click()}}
function openForm(title,fields,onSave){
  document.querySelector('#modalTitle').textContent=title;
  const f=document.querySelector('#modalForm');
  f.innerHTML=fields.map(([k,l,t,o],i)=>{
    if(t==='select')return `<label class="field"><span>${l}</span><select name="${k}">${o.map(x=>typeof x==='string'? `<option>${esc(x)}</option>`:`<option value="${esc(x.value)}">${esc(x.label)}</option>`).join('')}</select></label>`;
    if(t==='textarea')return `<label class="field full"><span>${l}</span><textarea name="${k}" rows="3" placeholder="${esc(placeholderFor(k,l))}"></textarea></label>`;
    if(t==='smart'){
      const opts=smart(o),id='dl_'+k+'_'+i;
      return `<label class="field"><span>${l}</span><input name="${k}" list="${id}" autocomplete="off" placeholder="${esc(placeholderFor(k,l))}"><datalist id="${id}">${opts.map(v=>`<option value="${esc(v)}"></option>`).join('')}</datalist>${opts.length?`<small>${opts.length} opção(ões) já cadastrada(s)</small>`:''}</label>`;
    }
    return `<label class="field"><span>${l}</span><input name="${k}" type="${t}" step="${t==='number'?'0.01':'any'}" placeholder="${esc(placeholderFor(k,l))}" ${t==='date'&&k==='data'?`value="${today}"`:''}></label>`;
  }).join('')+`<button class="btn primary" style="grid-column:1/-1">Salvar</button>`;
  f.onsubmit=async e=>{e.preventDefault();try{setBusy(true);await onSave(Object.fromEntries(new FormData(f).entries()));closeModal();await loadData();toast('Salvo!')}catch(err){toast(err.message||String(err),true)}finally{setBusy(false)}};
  document.querySelector('#modal').classList.add('open')
}
window.closeModal=()=>document.querySelector('#modal').classList.remove('open');

const shareToken=new URLSearchParams(location.search).get('share');
if(shareToken){
  await renderPublicShare(shareToken);
}else{
  initNav();
  const {data:{session:initialSession}}=await supabase.auth.getSession();session=initialSession;
  if(session){showApp();await loadData();subscribeRealtime()}else authScreen();
}
if(!shareToken){supabase.auth.onAuthStateChange(async(_event,s)=>{session=s;if(session){showApp();await loadData();subscribeRealtime()}else{if(channel){supabase.removeChannel(channel);channel=null}authScreen()}});}

</script>
