function toggleMeal(d,m,v){state.checks[key(d,m)]=v;save();renderHoje()}function setMood(d,v){state.mood[d]=v;save();renderHoje()}function saveNote(d){state.notes[d]=document.getElementById("note").value;save()}
function renderCardapio(){document.getElementById("page-cardapio").innerHTML='<h1 class="title">Cardápio de 30 dias</h1><p class="muted">Para 2 pessoas • refeições simples e variadas</p><div class="grid g2" style="margin-top:16px">'+menu.map((day,d)=>'<div class="card daycard '+(d===dayIndex()?"today":"")+'"><div class="pill">Dia '+(d+1)+'</div>'+day.map((x,i)=>'<label class="meal"><input type="checkbox" '+(state.checks[key(d,i)]?"checked":"")+' onchange="state.checks[\''+key(d,i)+'\']=this.checked;save()"><span><strong>'+mealNames[i]+'</strong><small>'+x+'</small></span></label>').join("")+'</div>').join("")+'</div>'}
function renderProgresso(){let total=0;for(let d=0;d<30;d++)total+=doneCount(d);const pct=Math.round(total/120*100),full=[...Array(30)].map((_,d)=>doneCount(d)===4).filter(Boolean).length;document.getElementById("page-progresso").innerHTML='<h1 class="title">Progresso</h1><div class="grid g3" style="margin-top:16px"><div class="card"><h2>'+pct+'%</h2><p class="muted">do plano concluído</p></div><div class="card"><h2>'+full+'</h2><p class="muted">dias completos</p></div><div class="card"><h2>'+total+'</h2><p class="muted">refeições marcadas</p></div></div><div class="card" style="margin-top:16px"><h2>Calendário</h2><div class="calendar">'+[...Array(30)].map((_,d)=>{let c=doneCount(d);return '<div class="d '+(c===4?"done":c>0?"partial":"")+'">'+(d+1)+'</div>'}).join("")+'</div><p class="muted">Verde: completo • dourado: parcial • cinza: ainda não iniciado</p></div><div class="card" style="margin-top:16px"><h2>Conquistas</h2><p>'+(full>=1?"✅ Primeiro dia completo":"⬜ Primeiro dia completo")+'</p><p>'+(full>=3?"✅ 3 dias firmes":"⬜ 3 dias firmes")+'</p><p>'+(full>=7?"✅ 7 dias firmes":"⬜ 7 dias firmes")+'</p><p>'+(full>=15?"✅ Metade do caminho":"⬜ Metade do caminho")+'</p><p>'+(full>=21?"✅ 21 dias":"⬜ 21 dias")+'</p><p>'+(full>=30?"✅ Plano concluído":"⬜ Plano concluído")+'</p><p class="quote">Hoje não define o mês inteiro. Recomeçar também é progresso.</p></div>'}
function renderReceitas(){document.getElementById("page-receitas").innerHTML='<h1 class="title">Receitas</h1><p class="muted">Todas pensadas para 2 pessoas e com preparo simples.</p><div class="recipes" style="margin-top:16px">'+recipeData.map((r,i)=>'<article class="card recipe"><div class="pill">'+(i+1)+'</div><h3>'+r[0]+'</h3><details><summary>Ver ingredientes e preparo</summary><p><strong>Ingredientes:</strong> '+r[1]+'</p><p><strong>Modo de preparo:</strong> '+r[2]+'</p><p class="muted">Dica: use pouco óleo, pouco sal e temperos suaves; ajuste qualquer alimento conforme sua tolerância.</p></details></article>').join("")+'</div>'}
function renderMais(){document.getElementById("page-mais").innerHTML='<h1 class="title">Mais</h1><div class="grid g2" style="margin-top:16px"><div class="card"><h2>Lista de compras</h2>'+shopping.map((x,i)=>'<label class="shoprow"><input type="checkbox" '+(state.shop[i]?"checked":"")+' onchange="state.shop['+i+']=this.checked;save()"><span><strong>'+x[0]+'</strong> — '+x[1]+'</span></label>').join("")+'</div><div><div class="card"><h2>Dicas para manter a rotina</h2><ul class="list">'+tips.map(x=>'<li style="margin:8px 0">'+x+'</li>').join("")+'</ul></div><div class="card" style="margin-top:16px"><h2>Configurações</h2><label>Data de início<br><input type="date" value="'+state.start+'" onchange="state.start=this.value;save();renderHoje()" style="padding:10px;border-radius:12px;border:1px solid #ccd8d1;margin-top:6px"></label><p><label><input type="checkbox" '+(state.faith?"checked":"")+' onchange="state.faith=this.checked;save()"> Mensagens de fé</label></p><p><label><input type="checkbox" '+(state.dark?"checked":"")+' onchange="state.dark=this.checked;save();applyDark()"> Modo escuro</label></p><button class="btn ghost" onclick="exportData()">Exportar progresso (JSON)</button><p class="muted">Os dados ficam salvos apenas neste dispositivo e navegador.</p></div></div></div>'}
function exportData(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}));a.download="caminho-leve-progresso.json";a.click()}
function toggleDark(){state.dark=!state.dark;save();applyDark();renderHoje()}function applyDark(){document.body.classList.toggle("dark",!!state.dark)}applyDark();show("hoje");
</script>
</body></html>
