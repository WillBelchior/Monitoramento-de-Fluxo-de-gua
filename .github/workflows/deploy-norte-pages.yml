name: Deploy Norte to GitHub Pages
# GitHub + Supabase deployment for Norte

on:
  push:
    branches: ["main"]
    paths:
      - "norte/**"
      - ".github/workflows/deploy-norte-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "norte-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Norte
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./norte

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
