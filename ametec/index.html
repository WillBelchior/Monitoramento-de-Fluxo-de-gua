/* ===== AMETEC PREMIUM THEME ===== */
:root{
  --navy:#06131d;
  --blue:#00aef0;
  --cyan:#19d4ff;
  --orange:#ffb000;
  --ink:#f4fbff;
  --muted:#9bb4c6;
  --line:#17384b;
  --bg:#06131d;
  --card:#0c1d29;
}
html,body{background:#06131d;color:var(--ink)}
body{background:
  radial-gradient(circle at 82% 4%,rgba(0,174,240,.13),transparent 28%),
  radial-gradient(circle at 15% 18%,rgba(255,176,0,.07),transparent 20%),
  linear-gradient(180deg,#05111a 0%,#081923 55%,#06131d 100%)}
body:before{opacity:.18;background-image:linear-gradient(rgba(24,212,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(24,212,255,.055) 1px,transparent 1px);background-size:34px 34px}
.side{background:linear-gradient(180deg,#02070b 0%,#071826 55%,#08273a 100%);border-right:1px solid #12354b;box-shadow:14px 0 40px #0008}
.brand{border-bottom:1px solid #17384b;padding:8px 8px 20px}

.nav button{color:#a9c0d0;font-weight:750;letter-spacing:.1px}
.nav button:hover,.nav button.active{color:#fff;background:linear-gradient(90deg,rgba(0,174,240,.18),rgba(255,176,0,.06));box-shadow:inset 4px 0 0 var(--orange),0 0 20px rgba(0,174,240,.06)}
.top{background:rgba(5,17,26,.92);backdrop-filter:blur(18px);border-bottom:1px solid #17384b;box-shadow:0 8px 28px #0004}
.top h1{color:#fff}.top small{color:#91aec0}.top .badge{background:#092a3d;color:#5fddff;border:1px solid #165675;box-shadow:0 0 16px rgba(0,174,240,.08)}

.content{color:var(--ink)}
.hero{background:
  linear-gradient(135deg,rgba(5,23,36,.98),rgba(9,60,91,.96) 58%,rgba(0,117,185,.92)),
  radial-gradient(circle at 80% 20%,rgba(255,176,0,.14),transparent 28%);
  border:1px solid #1b5875;box-shadow:0 18px 50px #0005, inset 0 1px 0 rgba(255,255,255,.04)}
.hero h2{color:#fff}.hero p{color:#b7cede}.hero .eyebrow{color:#53d9ff}
.panel,.metric,.entity,.quick button,.pending-card{background:linear-gradient(180deg,#0d202d,#0a1923);border-color:#17384b;color:#f4fbff;box-shadow:0 8px 24px #0002}
.panel{box-shadow:0 10px 28px #0003}
.panel h3,.entity-head b,.entity-grid b,.pending-head b,.pending-line b,.metric b,.quick button b{color:#f7fcff}
.panel-head small,.entity-head small,.entity-grid span,.pending-head small,.pending-line span,.metric span,.metric small,.quick button small{color:#91aabc}
.entity-head{border-bottom-color:#17384b;background:rgba(255,255,255,.012)}
.entity-grid,.pending-fin{background:#071722;border-color:#17384b}
.entity-grid>div,.pending-fin>div{border-color:#17384b}
.pending-col,.col{background:#081925;border:1px solid #14374a}
.pending-col h4,.col h4{color:#b8d3e4}
.pending-card select,.task select,.toolbar input,.toolbar select,.field input,.field select,.field textarea{background:#071722;color:#eefaff;border-color:#1b4055}
.pending-card select:focus,.task select:focus,.toolbar input:focus,.toolbar select:focus,.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:#00aef0;box-shadow:0 0 0 3px rgba(0,174,240,.12)}
.progress{background:#122a39}.progress i{background:linear-gradient(90deg,#008fd1,#19d4ff,#ffb000)}
.btn.primary{background:linear-gradient(135deg,#ffb000,#ffd45a);color:#06131d;box-shadow:0 8px 22px rgba(255,176,0,.18)}
.btn.secondary{background:#102c3d;color:#d8f2ff;border:1px solid #1d4960}
.btn.ghost{background:rgba(0,174,240,.12);color:#e8faff;border-color:#2d6e8d}.btn.danger{background:#3a1719;color:#ffaaa2;border:1px solid #7d3035}.btn.danger:hover{background:#4a1b1f}
.icon-btn{width:30px;height:30px;min-width:30px;padding:0!important;display:inline-grid;place-items:center;border-radius:8px;font-size:14px;line-height:1}

function serviceValues(s){
  const extras=data.adicionais.filter(a=>a.servico_id===s.id);
  const additionalService=extras.reduce((n,a)=>n+(+a.valor_servico||0),0);
  const additionalMaterial=extras.reduce((n,a)=>n+(+a.valor_material||0),0);
  const service=(+s.valor_servico||0)+additionalService;
  const materialQuoted=(+s.valor_material||0)+additionalMaterial;
  const materialMode=s.material_fornecimento||(materialQuoted>0?'AMETEC compra para o serviço':null);
  const materialBillable=materialMode==='Cliente compra'?0:materialQuoted;
  const materialRecovery=materialMode==='AMETEC compra para o serviço'?materialBillable:0;
  const materialSale=materialMode==='Estoque AMETEC'?materialBillable:0;
  return {service,material:materialBillable,materialQuoted,materialMode,materialRecovery,materialSale,additionalService,additionalMaterial,additional:additionalService+additionalMaterial,total:service+materialBillable};
}
function paySummary(s){
  const values=serviceValues(s);
  const total=values.total;
  const pays=data.pagamentos.filter(p=>p.servico_id===s.id);
  const received=pays.reduce((a,p)=>a+(+p.valor||0),0);

  let serviceReceived=0,materialReceived=0,legacyReceived=0;
  pays.forEach(p=>{
    const cat=p.categoria||'Geral';
    if(cat==='Serviço')serviceReceived+=+p.valor||0;
    else if(cat==='Material')materialReceived+=+p.valor||0;
    else if(cat==='Ambos'){
      serviceReceived+=+p.valor_servico||0;
      materialReceived+=+p.valor_material||0;
    }else legacyReceived+=+p.valor||0;
  });

  // Pagamentos antigos não possuíam categoria. Para preservar o histórico,
  // o valor legado é abatido primeiro do material e depois do serviço.
  let legacy=legacyReceived;
  const matNeed=Math.max(values.material-materialReceived,0);
  const legacyToMaterial=Math.min(matNeed,legacy);
  materialReceived+=legacyToMaterial;legacy-=legacyToMaterial;
  const svcNeed=Math.max(values.service-serviceReceived,0);
  const legacyToService=Math.min(svcNeed,legacy);
  serviceReceived+=legacyToService;

  serviceReceived=Math.min(serviceReceived,values.service);
  materialReceived=Math.min(materialReceived,values.material);
  const serviceBalance=Math.max(values.service-serviceReceived,0);
  const materialBalance=Math.max(values.material-materialReceived,0);
  const balance=Math.max(total-received,0);
  const last=[...pays].sort((a,b)=>(b.data_pagamento||'').localeCompare(a.data_pagamento||''))[0];
  let state=total<=0?'Sem cobrança':'Não pago';
  if(total>0&&received>=total)state='Pago';
  else if(received>0&&balance>0)state='Parcial';
  if(balance>0&&s.vencimento_pagamento&&s.vencimento_pagamento<today)state='Vencido';
  const settled=balance<=0;
  return {total,received,balance,last,state,settled,serviceReceived,materialReceived,serviceBalance,materialBalance,legacyReceived,values};
}

function closureState(s){
  const p=paySummary(s);
  const technicallyDone=s.atendimento_status==='Concluída'||s.status==='Concluído'||(+s.progresso||0)>=100;
  if(!technicallyDone)return {key:'open',label:'Em aberto',className:'run',payment:p};
  if(p.settled)return {key:'closed',label:'Encerrado',className:'done',payment:p};
  if(p.state==='Vencido')return {key:'overdue',label:'Pagamento vencido',className:'late',payment:p};
  return {key:'payment_pending',label:'Pagamento pendente',className:'high',payment:p};
}

  return data.servicos.map(s=>({s,...closureState(s)})).filter(x=>x.key==='payment_pending'||x.key==='overdue');

function pendencias(){
  const stages=['Elaborando orçamento','Aguardando aprovação','Orçamento aprovado','Em andamento','Pausada','Concluída'];
  document.querySelector('#app').innerHTML=`
    <section class="hero"><div class="hero-grid"><div><div class="eyebrow">CENTRAL DE PENDÊNCIAS</div><h2>Atendimentos, orçamentos e recebimentos</h2><p>Organize tudo por etapa e saiba exatamente qual é a próxima ação.</p></div><button class="btn primary" id="newPending">+ Serviço</button></div></section>
    <div class="metrics">
      ${card('Elaborando orçamento',data.servicos.filter(x=>x.atendimento_status==='Elaborando orçamento').length)}
      ${card('Aguardando aprovação',data.servicos.filter(x=>x.atendimento_status==='Aguardando aprovação').length)}
      ${card('Orçamentos aprovados',data.servicos.filter(x=>x.atendimento_status==='Orçamento aprovado').length)}
      ${card('Serviços a receber',money(data.servicos.reduce((s,x)=>s+paySummary(x).serviceBalance,0)))}
      ${card('Materiais a receber',money(data.servicos.reduce((s,x)=>s+paySummary(x).materialBalance,0)))}
    </div>
    <div id="financeManagementAlerts"></div>
    <section class="panel">
      <div class="toolbar"><input id="pendingSearch" placeholder="🔎 Buscar cliente, serviço, responsável, orçamento ou próxima ação"></div>
      <div id="pendingBoard"></div>
    </section>`;

  const alerts=financialAlerts();
  const overdueAlerts=alerts.filter(x=>x.key==='overdue');
  const pendingAlerts=alerts.filter(x=>x.key==='payment_pending');
  const alertBox=document.querySelector('#financeManagementAlerts');
  if(alertBox){
    alertBox.innerHTML=
      (overdueAlerts.length?`<div class="management-alert danger"><span style="font-size:22px">🔴</span><div><strong>${overdueAlerts.length} pagamento(s) vencido(s)</strong><small>Serviços: ${money(overdueAlerts.reduce((s,x)=>s+x.payment.serviceBalance,0))} • Materiais: ${money(overdueAlerts.reduce((s,x)=>s+x.payment.materialBalance,0))}</small></div><button class="btn secondary" data-finance-filter="overdue">Ver</button></div>`:'')+
      (pendingAlerts.length?`<div class="management-alert warn"><span style="font-size:22px">⚠</span><div><strong>${pendingAlerts.length} serviço(s) concluído(s) aguardando pagamento</strong><small>Serviços: ${money(pendingAlerts.reduce((s,x)=>s+x.payment.serviceBalance,0))} • Materiais: ${money(pendingAlerts.reduce((s,x)=>s+x.payment.materialBalance,0))}</small></div><button class="btn secondary" data-finance-filter="pending">Ver</button></div>`:'');
  }
  const draw=(query='')=>{
    const q=query.trim().toLowerCase();
    const rows=sortByPriority(data.servicos.filter(x=>{
      const c=data.clientes.find(a=>a.id===x.cliente_id);
      return !q||[x.titulo,x.tipo,x.responsavel,x.orcamento_status,x.proxima_acao,c?.nome_fantasia].filter(Boolean).join(' ').toLowerCase().includes(q);
    }));
    document.querySelector('#pendingBoard').innerHTML=`<div class="pending-board">${stages.map(st=>`<div class="pending-col" data-stage="${st}"><h4><span>${st}</span><span data-stage-count="${st}">${rows.filter(x=>(x.atendimento_status||'Aguardando aprovação')===st).length}</span></h4><div data-stage-list="${st}">${rows.filter(x=>(x.atendimento_status||'Aguardando aprovação')===st).map(pendingCard).join('')||'<div class="empty">Sem itens</div>'}</div></div>`).join('')}</div>`;
    bindPending();
  };
  const refreshStageCounts=()=>{
    stages.forEach(st=>{
      const list=document.querySelector('[data-stage-list="'+st+'"]');
      const count=document.querySelector('[data-stage-count="'+st+'"]');
      if(count&&list)count.textContent=list.querySelectorAll('[data-service-card]').length;
      if(list){
        const cards=list.querySelectorAll('[data-service-card]');
        const empty=list.querySelector('.empty');
        if(!cards.length&&!empty)list.innerHTML='<div class="empty">Sem itens</div>';
        if(cards.length&&empty)empty.remove();
      }
    });
  };
  const refreshPendingMetrics=()=>{
    const metrics=document.querySelectorAll('.metrics .metric b');
    if(metrics.length>=5){
      metrics[0].textContent=data.servicos.filter(x=>x.atendimento_status==='Elaborando orçamento').length;
      metrics[1].textContent=data.servicos.filter(x=>x.atendimento_status==='Aguardando aprovação').length;
      metrics[2].textContent=data.servicos.filter(x=>x.atendimento_status==='Orçamento aprovado').length;
      metrics[3].textContent=money(data.servicos.reduce((s,x)=>s+paySummary(x).serviceBalance,0));
      metrics[4].textContent=money(data.servicos.reduce((s,x)=>s+paySummary(x).materialBalance,0));
    }
    renderFinanceAlert();
  };
  const moveCardInstantly=(id,newStage)=>{
    const cardEl=document.querySelector('[data-service-card="'+id+'"]');
    const target=document.querySelector('[data-stage-list="'+newStage+'"]');
    if(!cardEl||!target)return;
    const empty=target.querySelector('.empty');if(empty)empty.remove();
    target.appendChild(cardEl);
    refreshStageCounts();
  };
  const bindPending=()=>{
    document.querySelectorAll('[data-edit-service]').forEach(b=>b.onclick=()=>editService(b.dataset.editService));
    document.querySelectorAll('[data-duplicate-service]').forEach(b=>b.onclick=()=>duplicateService(b.dataset.duplicateService));
    document.querySelectorAll('[data-proposal-service]').forEach(b=>b.onclick=()=>openProposal(b.dataset.proposalService));
    document.querySelectorAll('[data-atendimento]').forEach(s=>s.onchange=async e=>{
      const id=e.target.dataset.atendimento,st=e.target.value;
      const item=data.servicos.find(x=>x.id===id);
      const oldStage=item?.atendimento_status||'Aguardando aprovação';
      const oldSnapshot=item?{...item}:null;
      const patch={atendimento_status:st};
      if(st==='Elaborando orçamento'){patch.status='Planejado';patch.orcamento_status='Em elaboração'}
      if(st==='Aguardando aprovação'){patch.status='Planejado';patch.orcamento_status='Aguardando resposta'}
      if(st==='Orçamento aprovado'){patch.status='Planejado';patch.orcamento_status='Aprovado'}
      if(st==='Em andamento')patch.status='Em execução';
      if(st==='Pausada')patch.status='Pausado';
      if(st==='Concluída'){patch.status='Concluído';patch.progresso=100;patch.data_conclusao=today}

      // Optimistic update: move immediately, no page refresh.
      if(item)Object.assign(item,patch);
      moveCardInstantly(id,st);
      refreshPendingMetrics();

      const {error}=await supabase.from('ametec_servicos').update(patch).eq('id',id);
      if(error){
        if(item&&oldSnapshot)Object.assign(item,oldSnapshot);
        e.target.value=oldStage;
        moveCardInstantly(id,oldStage);
        refreshPendingMetrics();
        toast(error.message,true);
      }else{
        // Rebuild only this card so its financial/conclusion banner is correct,
        // without reloading the page.
        const oldCard=document.querySelector('[data-service-card="'+id+'"]');
        if(oldCard&&item){
          const wrap=document.createElement('div');
          wrap.innerHTML=pendingCard(item).trim();
          const fresh=wrap.firstElementChild;
          oldCard.replaceWith(fresh);
          bindPending();
          refreshStageCounts();
        }
        toast('Atendimento atualizado');
      }
    });
    document.querySelectorAll('[data-orcamento]').forEach(s=>s.onchange=async e=>{
      const patch={orcamento_status:e.target.value};
      if(['Enviado','Aguardando resposta'].includes(e.target.value)&&!data.servicos.find(x=>x.id===e.target.dataset.orcamento)?.orcamento_data_envio)patch.orcamento_data_envio=today;
      const {error}=await supabase.from('ametec_servicos').update(patch).eq('id',e.target.dataset.orcamento);
      if(error)toast(error.message,true);else toast('Orçamento atualizado')
    });
    document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{
      const x=data.servicos.find(s=>s.id===b.dataset.action);
      openForm('Próxima ação — '+x.titulo,[['proxima_acao','Próxima ação','text'],['proxima_acao_data','Data / prazo','date'],['vencimento_pagamento','Vencimento financeiro','date']],async v=>{const {error}=await supabase.from('ametec_servicos').update(v).eq('id',x.id);if(error)throw error})
    });
    document.querySelectorAll('[data-delete-service]').forEach(b=>b.onclick=async()=>{
      const id=b.dataset.deleteService;
      const x=data.servicos.find(s=>s.id===id);
      if(!x)return;
      const c=data.clientes.find(a=>a.id===x.cliente_id);
      const ok=confirm('Excluir o serviço "'+x.titulo+'" de '+(c?.nome_fantasia||'cliente')+'?\n\nIsso também removerá pagamentos, materiais e registros vinculados a este serviço. Essa ação não pode ser desfeita.');
      if(!ok)return;

      const card=document.querySelector('[data-service-card="'+id+'"]');
      const previousParent=card?.parentElement;
      const previousNext=card?.nextSibling;
      card?.remove();
      data.servicos=data.servicos.filter(s=>s.id!==id);
      refreshStageCounts();
      refreshPendingMetrics();

      const {error}=await supabase.from('ametec_servicos').delete().eq('id',id);
      if(error){
        if(card&&previousParent){
          if(previousNext)previousParent.insertBefore(card,previousNext);else previousParent.appendChild(card);
        }
        await load();
        toast(error.message,true);
      }else{
        toast('Serviço excluído');
      }
    });

    document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{
      const x=data.servicos.find(s=>s.id===b.dataset.pay);if(x)openPaymentForm(x)
    });
  };
  draw();
  document.querySelectorAll('[data-finance-filter]').forEach(b=>b.onclick=()=>{
    const mode=b.dataset.financeFilter;
    const rows=sortByPriority(data.servicos.filter(s=>mode==='overdue'?closureState(s).key==='overdue':closureState(s).key==='payment_pending'));
    document.querySelector('#pendingBoard').innerHTML=`<div class="pending-board">${stages.map(st=>`<div class="pending-col" data-stage="${st}"><h4><span>${st}</span><span data-stage-count="${st}">${rows.filter(x=>x.atendimento_status===st).length}</span></h4><div data-stage-list="${st}">${rows.filter(x=>x.atendimento_status===st).map(pendingCard).join('')||'<div class="empty">Sem itens</div>'}</div></div>`).join('')}</div>`;
    bindPending();
  });
  document.querySelector('#pendingSearch').oninput=e=>draw(e.target.value);
  document.querySelector('#newPending').onclick=newService;
}

      data.servicos=data.servicos.filter(s=>s.id!==id);data.lembretes=data.lembretes.filter(r=>r.servico_id!==id);draw();renderFinanceAlert();toast('Serviço excluído');
    });
  };

  document.querySelector('#search').oninput=draw;
  document.querySelector('#filter').onchange=draw;
  draw();
  document.querySelector('#add').onclick=newService
}

async function openServiceReminders(id,afterChange){
  const s=data.servicos.find(x=>x.id===id);if(!s)return;
  const c=data.clientes.find(x=>x.id===s.cliente_id);

  </div>`;

  const drawReminders=()=>{
    const rows=data.lembretes.filter(r=>r.servico_id===id).sort((a,b)=>(+a.concluido)-(+b.concluido)||(b.created_at||'').localeCompare(a.created_at||''));
    form.querySelector('#reminderList').innerHTML=rows.map(r=>`<div class="reminder-item ${r.concluido?'done':''}">

    form.querySelectorAll('[data-reminder-done]').forEach(ch=>ch.onchange=async()=>{

      const {error}=await supabase.from('ametec_servico_lembretes').update({concluido:ch.checked,updated_at:new Date().toISOString()}).eq('id',r.id);
      if(error){ch.checked=!ch.checked;return toast(error.message,true)}

    });

  form.onsubmit=e=>e.preventDefault();
  drawReminders();
  modal.classList.add('open');
}

function materialCatalogTotal(selection){
  return Object.entries(selection||{}).reduce((sum,[id,qty])=>{
    const m=data.materiais.find(x=>x.id===id);
    return sum+(m?(+m.valor_unitario||0)*(+qty||0):0);
  },0);
}
function materialPickerHtml(selection={},prefix='mat'){
  if(!data.materiais.length)return '<div class="composition-empty">Nenhum material cadastrado. Cadastre itens na aba Materiais para reutilizá-los aqui.</div>';
  return '<div class="material-pick-list">'+data.materiais.map(m=>{
    const qty=selection[m.id]||0,checked=qty>0;
    return '<label class="material-pick-row"><input type="checkbox" data-mat-check="'+prefix+'" data-material-id="'+m.id+'" '+(checked?'checked':'')+'><span><b>'+esc(m.descricao)+'</b><small>'+esc([m.fornecedor,m.unidade].filter(Boolean).join(' • ')||'Material cadastrado')+' • '+money(m.valor_unitario)+'/un.</small></span><input type="number" min="0.01" step="0.01" value="'+(checked?qty:1)+'" data-mat-qty="'+prefix+'" data-material-id="'+m.id+'" '+(checked?'':'disabled')+'></label>';
  }).join('')+'</div>';
}
function setupServiceComposition(form,serviceId=null){
  const baseLinks=data.servicoMateriais.filter(l=>l.servico_id===serviceId&&!l.adicional_id);
  form._baseMaterials=Object.fromEntries(baseLinks.map(l=>[l.material_id,+l.quantidade||1]));
  form._additionalDrafts=data.adicionais.filter(a=>a.servico_id===serviceId).map(a=>({
    id:a.id,descricao:a.descricao||'',valor_servico:+a.valor_servico||0,valor_material:+a.valor_material||0,
    materials:Object.fromEntries(data.servicoMateriais.filter(l=>l.adicional_id===a.id).map(l=>[l.material_id,+l.quantidade||1]))
  }));
  const baseBox=form.querySelector('#baseMaterialPicker');
  const addList=form.querySelector('#additionalValuesList');

  const bindPicker=(root,selection,onChange)=>{
    root.querySelectorAll('[data-mat-check]').forEach(ch=>ch.onchange=()=>{
      const id=ch.dataset.materialId,qty=root.querySelector('[data-mat-qty][data-material-id="'+id+'"]');
      if(ch.checked){selection[id]=+qty.value||1;qty.disabled=false}else{delete selection[id];qty.disabled=true}
      onChange();
    });
    root.querySelectorAll('[data-mat-qty]').forEach(q=>q.oninput=()=>{
      const id=q.dataset.materialId,ch=root.querySelector('[data-mat-check][data-material-id="'+id+'"]');
      if(ch?.checked){selection[id]=+q.value||1;onChange()}
    });
  };

  const renderBase=()=>{
    if(!baseBox)return;
    baseBox.innerHTML='<details><summary>📦 Selecionar materiais cadastrados <span class="composition-count">'+Object.keys(form._baseMaterials).length+'</span></summary>'+materialPickerHtml(form._baseMaterials,'base')+'<div class="material-picker-foot"><span>Total selecionado: <b>'+money(materialCatalogTotal(form._baseMaterials))+'</b></span><button type="button" class="btn secondary" id="useBaseMaterialTotal">Usar no valor de material</button></div></details>';
    bindPicker(baseBox,form._baseMaterials,renderBase);
    const use=baseBox.querySelector('#useBaseMaterialTotal');
    if(use)use.onclick=()=>{
      const input=form.querySelector('[name="valor_material"]');
      if(!input){toast('Adicione primeiro o bloco Valores.',true);return}
      input.value=materialCatalogTotal(form._baseMaterials).toFixed(2);
      toast('Valor dos materiais aplicado');
    };
  };

  const renderAdds=()=>{
    if(!addList)return;
    addList.innerHTML=form._additionalDrafts.map((a,i)=>'<article class="additional-value-card" data-add-index="'+i+'"><div class="additional-value-head"><b>Adicional '+(i+1)+'</b><button type="button" class="btn danger icon-btn" data-remove-add="'+i+'" title="Remover">×</button></div><label class="field full"><span>Descrição</span><input data-add-field="descricao" value="'+esc(a.descricao)+'" placeholder="Ex.: Fabricação e instalação do painel de comando"></label><div class="additional-money-grid"><label class="field"><span>Valor de serviço</span><input data-add-field="valor_servico" type="number" min="0" step="0.01" value="'+(a.valor_servico||0)+'"></label><label class="field"><span>Valor de material</span><input data-add-field="valor_material" type="number" min="0" step="0.01" value="'+(a.valor_material||0)+'"></label></div><details class="additional-materials"><summary>📦 Materiais cadastrados <span class="composition-count">'+Object.keys(a.materials||{}).length+'</span></summary>'+materialPickerHtml(a.materials||{},'add'+i)+'<div class="material-picker-foot"><span>Total selecionado: <b>'+money(materialCatalogTotal(a.materials||{}))+'</b></span><button type="button" class="btn secondary" data-use-add-material="'+i+'">Usar no valor de material</button></div></details></article>').join('')||'<div class="composition-empty">Nenhum valor adicional. Use “+ Adicionar valor” quando surgir algo além do orçamento principal.</div>';
    addList.querySelectorAll('[data-add-index]').forEach(card=>{
      const i=+card.dataset.addIndex,a=form._additionalDrafts[i];
      card.querySelectorAll('[data-add-field]').forEach(inp=>inp.oninput=()=>{a[inp.dataset.addField]=inp.dataset.addField==='descricao'?inp.value:(+inp.value||0)});
      bindPicker(card,a.materials,renderAdds);
    });
    addList.querySelectorAll('[data-remove-add]').forEach(b=>b.onclick=()=>{form._additionalDrafts.splice(+b.dataset.removeAdd,1);renderAdds()});
    addList.querySelectorAll('[data-use-add-material]').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.useAddMaterial,a=form._additionalDrafts[i];
      a.valor_material=materialCatalogTotal(a.materials||{});
      renderAdds();toast('Valor dos materiais aplicado ao adicional');
    });
  };

  form.querySelector('#addAdditionalValue')?.addEventListener('click',()=>{
    form._additionalDrafts.push({descricao:'',valor_servico:0,valor_material:0,materials:{}});
    renderAdds();
  });
  renderBase();renderAdds();
}
async function saveServiceComposition(form,serviceId){
  const {error:linkDel}=await supabase.from('ametec_servico_materiais').delete().eq('servico_id',serviceId);
  if(linkDel)throw linkDel;
  const {error:addDel}=await supabase.from('ametec_servico_adicionais').delete().eq('servico_id',serviceId);
  if(addDel)throw addDel;

  const baseRows=Object.entries(form._baseMaterials||{}).map(([material_id,quantidade])=>{
    const m=data.materiais.find(x=>x.id===material_id);
    return {servico_id:serviceId,material_id,quantidade:+quantidade||1,valor_unitario:+m?.valor_unitario||0};
  });
  if(baseRows.length){const {error}=await supabase.from('ametec_servico_materiais').insert(baseRows);if(error)throw error}

  const drafts=(form._additionalDrafts||[]).filter(a=>a.descricao.trim()||a.valor_servico>0||a.valor_material>0||Object.keys(a.materials||{}).length);
  for(let i=0;i<drafts.length;i++){
    const a=drafts[i];
    const {data:row,error}=await supabase.from('ametec_servico_adicionais').insert({
      servico_id:serviceId,descricao:a.descricao.trim()||('Valor adicional '+(i+1)),
      valor_servico:+a.valor_servico||0,valor_material:+a.valor_material||0,
      valor:(+a.valor_servico||0)+(+a.valor_material||0),destino:'Serviço',ordem:i+1
    }).select().single();
    if(error)throw error;
    const links=Object.entries(a.materials||{}).map(([material_id,quantidade])=>{
      const m=data.materiais.find(x=>x.id===material_id);
      return {servico_id:serviceId,adicional_id:row.id,material_id,quantidade:+quantidade||1,valor_unitario:+m?.valor_unitario||0};
    });
    if(links.length){const {error:le}=await supabase.from('ametec_servico_materiais').insert(links);if(le)throw le}
  }
}

    if(s.data_agendada)agendaEvents.push({...base,date:s.data_agendada,time:s.horario_agendado||'',type:'schedule',label:'Serviço agendado',icon:'🔧'});

    if(e.type==='completion')return 'done';

    if(e.date===today)return 'now';
    return 'future';
  };
  const eventHtml=e=>{

    if(view==='diaria'){
      const iso=fmtISO(cursor);
      const rows=agendaEvents.filter(e=>e.date===iso).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99')||priorityRank(a.service?.prioridade)-priorityRank(b.service?.prioridade));

      body.innerHTML='<div class="calendar-day-view">'+(rows.map(e=>'<article class="calendar-day-card '+eventState(e)+'"><b>'+esc((e.time?e.time.slice(0,5)+' • ':'')+e.icon+' '+e.label)+'</b><small style="display:block;margin-top:4px;color:#91adbd">'+esc(e.service?.titulo||'Serviço')+' • '+esc(e.client?.nome_fantasia||'Sem cliente')+' • '+esc(e.service?.prioridade||'')+'</small></article>').join('')||'<div class="empty">Nenhum evento nesta data.</div>')+'</div>';

    }else{
      const y=cursor.getFullYear(),m=cursor.getMonth(),first=new Date(y,m,1),gridStart=startWeek(first);
      title.textContent=cursor.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
      const heads=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(x=>'<div class="calendar-weekday">'+x+'</div>').join('');
      const days=Array.from({length:42},(_,i)=>{
        const d=addDays(gridStart,i),iso=fmtISO(d);
        const rows=agendaEvents.filter(e=>e.date===iso).sort((a,b)=>priorityRank(a.service?.prioridade)-priorityRank(b.service?.prioridade));
        return '<div class="calendar-day '+(d.getMonth()!==m?'muted ':'')+(iso===today?'today':'')+'"><div class="calendar-date">'+d.getDate()+'</div>'+rows.slice(0,4).map(eventHtml).join('')+(rows.length>4?'<small style="color:#8aa7b8">+'+(rows.length-4)+' evento(s)</small>':'')+'</div>'
      }).join('');
      body.innerHTML='<div class="calendar-month">'+heads+days+'</div>';
    }
  };

  document.querySelectorAll('[data-ag-view]').forEach(b=>b.onclick=()=>{view=b.dataset.agView;localStorage.setItem('ametecAgendaView',view);renderCalendar()});

}
