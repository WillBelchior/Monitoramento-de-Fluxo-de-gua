/* ===== AMETEC PREMIUM THEME ===== */
:root{
  --navy:#06131d;
  --blue:#00aef0;
  --cyan:#19d4ff;
  --orange:#ffb000;
  --ink:#f4fbff;
  --muted:#9bb4c6;
  --line:#17384b;
  --bg:#06131d;
  --card:#0c1d29;
}
html,body{background:#06131d;color:var(--ink)}
body{background:
  radial-gradient(circle at 82% 4%,rgba(0,174,240,.13),transparent 28%),
  radial-gradient(circle at 15% 18%,rgba(255,176,0,.07),transparent 20%),
  linear-gradient(180deg,#05111a 0%,#081923 55%,#06131d 100%)}
body:before{opacity:.18;background-image:linear-gradient(rgba(24,212,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(24,212,255,.055) 1px,transparent 1px);background-size:34px 34px}
.side{background:linear-gradient(180deg,#02070b 0%,#071826 55%,#08273a 100%);border-right:1px solid #12354b;box-shadow:14px 0 40px #0008}
.brand{border-bottom:1px solid #17384b;padding:8px 8px 20px}
.brand img{width:100%;max-width:250px!important;display:block;margin:auto;border-radius:14px;box-shadow:0 0 28px rgba(0,174,240,.18)}
.nav button{color:#a9c0d0;font-weight:750;letter-spacing:.1px}
.nav button:hover,.nav button.active{color:#fff;background:linear-gradient(90deg,rgba(0,174,240,.18),rgba(255,176,0,.06));box-shadow:inset 4px 0 0 var(--orange),0 0 20px rgba(0,174,240,.06)}
.top{background:rgba(5,17,26,.92);backdrop-filter:blur(18px);border-bottom:1px solid #17384b;box-shadow:0 8px 28px #0004}
.top h1{color:#fff}.top small{color:#91aec0}.top .badge{background:#092a3d;color:#5fddff;border:1px solid #165675;box-shadow:0 0 16px rgba(0,174,240,.08)}
.top-logo{border-radius:10px;box-shadow:0 0 18px rgba(0,174,240,.16)}
.content{color:var(--ink)}
.hero{background:
  linear-gradient(135deg,rgba(5,23,36,.98),rgba(9,60,91,.96) 58%,rgba(0,117,185,.92)),
  radial-gradient(circle at 80% 20%,rgba(255,176,0,.14),transparent 28%);
  border:1px solid #1b5875;box-shadow:0 18px 50px #0005, inset 0 1px 0 rgba(255,255,255,.04)}
.hero h2{color:#fff}.hero p{color:#b7cede}.hero .eyebrow{color:#53d9ff}
.panel,.metric,.entity,.quick button,.pending-card{background:linear-gradient(180deg,#0d202d,#0a1923);border-color:#17384b;color:#f4fbff;box-shadow:0 8px 24px #0002}
.panel{box-shadow:0 10px 28px #0003}
.panel h3,.entity-head b,.entity-grid b,.pending-head b,.pending-line b,.metric b,.quick button b{color:#f7fcff}
.panel-head small,.entity-head small,.entity-grid span,.pending-head small,.pending-line span,.metric span,.metric small,.quick button small{color:#91aabc}
.entity-head{border-bottom-color:#17384b;background:rgba(255,255,255,.012)}
.entity-grid,.pending-fin{background:#071722;border-color:#17384b}
.entity-grid>div,.pending-fin>div{border-color:#17384b}
.pending-col,.col{background:#081925;border:1px solid #14374a}
.pending-col h4,.col h4{color:#b8d3e4}
.pending-card select,.task select,.toolbar input,.toolbar select,.field input,.field select,.field textarea{background:#071722;color:#eefaff;border-color:#1b4055}
.pending-card select:focus,.task select:focus,.toolbar input:focus,.toolbar select:focus,.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:#00aef0;box-shadow:0 0 0 3px rgba(0,174,240,.12)}
.progress{background:#122a39}.progress i{background:linear-gradient(90deg,#008fd1,#19d4ff,#ffb000)}
.btn.primary{background:linear-gradient(135deg,#ffb000,#ffd45a);color:#06131d;box-shadow:0 8px 22px rgba(255,176,0,.18)}
.btn.secondary{background:#102c3d;color:#d8f2ff;border:1px solid #1d4960}
.btn.ghost{background:rgba(0,174,240,.12);color:#e8faff;border-color:#2d6e8d}
.status{background:#122b3b;color:#a9cadc}
.status.run{background:#0c3851;color:#67d8ff}.status.done{background:#123c2f;color:#76e3b0}.status.late{background:#432127;color:#ff9f9f}.status.high{background:#4a3512;color:#ffd36b}
.bar{background:linear-gradient(180deg,#19d4ff,#008ed4)}
.donut:after{background:#0d202d}
.task{background:#0c1d29;border-color:#17384b}
.modal-bg{background:#01070bd9}.modal,.auth-card{background:linear-gradient(180deg,#0c1d29,#081722);border-color:#17384b;color:#f5fbff;box-shadow:0 24px 80px #0008}
.auth{background:
 radial-gradient(circle at 50% 10%,rgba(0,174,240,.13),transparent 30%),
 linear-gradient(180deg,#03090e,#071722)}
.auth-brand img{border-radius:16px;box-shadow:0 0 34px rgba(0,174,240,.16)}
.bottom{background:rgba(4,14,21,.96);border-top-color:#17384b}.bottom button{color:#8eabbc}.bottom button.active{color:#55dcff}

function showApp(){document.querySelector('.shell').style.display='block';document.querySelector('#auth')?.remove()}
async function load(){
  const qs=await Promise.all([
    supabase.from('ametec_clientes').select('*').order('created_at',{ascending:false}),
    supabase.from('ametec_cliente_contatos').select('*').order('principal',{ascending:false}).order('created_at',{ascending:true}),
    supabase.from('ametec_servicos').select('*').order('created_at',{ascending:false}),
    supabase.from('ametec_equipamentos').select('*').order('created_at',{ascending:false}),
    supabase.from('ametec_materiais').select('*').order('created_at',{ascending:false}),
    supabase.from('ametec_colaboradores').select('*').order('created_at',{ascending:false}),
    supabase.from('ametec_registros').select('*').order('created_at',{ascending:false}),
    supabase.from('ametec_pagamentos').select('*').order('data_pagamento',{ascending:false})
  ]);
  if(qs.some(x=>x.error))return toast('Não foi possível carregar todos os dados.',true);
  [data.clientes,data.clienteContatos,data.servicos,data.equipamentos,data.materiais,data.colaboradores,data.registros,data.pagamentos]=qs.map(x=>x.data||[]);
  render()
}
function subscribe(){
  if(channel)supabase.removeChannel(channel);
  channel=supabase.channel('ametec-live');
  ['ametec_clientes','ametec_cliente_contatos','ametec_servicos','ametec_equipamentos','ametec_materiais','ametec_colaboradores','ametec_registros','ametec_pagamentos'].forEach(t=>channel.on('postgres_changes',{event:'*',schema:'public',table:t},()=>load()));
  channel.subscribe()
}
function initNav(){
  const n=document.querySelector('#nav'),b=document.querySelector('#bottom');
  n.innerHTML=pages.map(([k,l,i])=>'<button data-p="'+k+'">'+i+' '+l+'</button>').join('')+'<button id="logout">🚪 Sair</button>';
  const mobile=['dashboard','pendencias','servicos','agenda','clientes'].map(k=>pages.find(x=>x[0]===k));
  b.innerHTML=mobile.map(([k,l,i])=>'<button data-p="'+k+'">'+i+'<br>'+l+'</button>').join('');
  document.querySelectorAll('[data-p]').forEach(x=>x.onclick=()=>{page=x.dataset.p;document.querySelector('#side').classList.remove('open');render()});
  document.querySelector('#menu').onclick=()=>document.querySelector('#side').classList.toggle('open');
  document.querySelector('#logout').onclick=()=>supabase.auth.signOut()
}
function render(){
  document.querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('active',x.dataset.p===page));
  const p=pages.find(x=>x[0]===page);document.querySelector('#title').textContent=p?.[1]||'AMETEC';
  document.querySelector('#subtitle').textContent=page==='dashboard'?'Centro de Operações • visão geral':'Gestão AMETEC';
  ({dashboard,pendencias,clientes,servicos,agenda,equipamentos,materiais,colaboradores,financeiro,relatorios}[page]||dashboard)()
}
function paySummary(s){
  const total=(+s.valor_servico||0)+(+s.valor_material||0);
  const pays=data.pagamentos.filter(p=>p.servico_id===s.id);
  const received=pays.reduce((a,p)=>a+(+p.valor||0),0);
  const balance=Math.max(total-received,0);
  const last=[...pays].sort((a,b)=>(b.data_pagamento||'').localeCompare(a.data_pagamento||''))[0];
  let state='Não pago';
  if(total>0&&received>=total)state='Pago';
  else if(received>0)state='Parcial';
  if(balance>0&&s.vencimento_pagamento&&s.vencimento_pagamento<today)state='Vencido';
  return {total,received,balance,last,state};
}
function pendingCard(x){
  const c=data.clientes.find(a=>a.id===x.cliente_id),p=paySummary(x);
  const payClass=p.state==='Pago'?'done':p.state==='Vencido'?'late':p.state==='Parcial'?'run':'';
  return `<article class="pending-card">
    <div class="pending-head">
      <b>${esc(x.titulo)}</b>
      <small>🏭 ${esc(c?.nome_fantasia||'Sem cliente')} • ${esc(x.tipo||'Serviço')}</small>
    </div>
    <div class="pending-body">
      <div><span style="display:block;font-size:8px;color:#7b8998;text-transform:uppercase;margin-bottom:4px">Atendimento</span>
        <select data-atendimento="${x.id}">
          ${['Novo','Aguardando avaliação','Aguardando valor','Aguardando cliente','Aguardando disponibilidade','Agendado','Em execução','Concluído'].map(v=>`<option ${v===(x.atendimento_status||'Novo')?'selected':''}>${v}</option>`).join('')}
        </select>
      </div>
      <div><span style="display:block;font-size:8px;color:#7b8998;text-transform:uppercase;margin-bottom:4px">Orçamento</span>

function agenda(){
  const rows=[...data.servicos].sort((a,b)=>(a.data_agendada||'9999').localeCompare(b.data_agendada||'9999'));
  document.querySelector('#app').innerHTML=`<section class="hero"><div class="hero-grid"><div><div class="eyebrow">PLANEJAMENTO</div><h2>Agenda operacional</h2><p>Visualize prioridades, datas e evolução dos atendimentos.</p></div><button class="btn primary" id="add">+ Serviço</button></div></section><section class="panel"><div class="cards">${rows.map(x=>{const c=data.clientes.find(a=>a.id===x.cliente_id);return `<article class="entity"><div class="entity-head"><div><b>${date(x.data_agendada)} • ${esc(x.titulo)}</b><small>${esc(c?.nome_fantasia||'Sem cliente')} • ${esc(x.responsavel||'Sem responsável')}</small></div>${status(x.prioridade)}</div><div class="entity-body"><div><div style="display:flex;justify-content:space-between;font-size:9px;color:#748397;margin-bottom:5px"><span>EVOLUÇÃO</span><b data-label="${x.id}">${x.progresso||0}%</b></div><input type="range" min="0" max="100" step="5" value="${x.progresso||0}" data-progress="${x.id}" style="width:100%;accent-color:#0075c9"></div><div class="actions"><button class="btn secondary" data-set="${x.id}" data-v="25">25%</button><button class="btn secondary" data-set="${x.id}" data-v="50">50%</button><button class="btn secondary" data-set="${x.id}" data-v="75">75%</button><button class="btn primary" data-set="${x.id}" data-v="100">Concluir</button></div></div></article>`}).join('')||'<div class="empty">Nenhum serviço agendado.</div>'}</div></section>`;
  document.querySelector('#add').onclick=newService;
  const save=async(id,v)=>{const patch={progresso:+v,status:+v===100?'Concluído':(+v>0?'Em execução':'Planejado')};const {error}=await supabase.from('ametec_servicos').update(patch).eq('id',id);if(error)toast(error.message,true);else toast('Evolução atualizada')};
  document.querySelectorAll('[data-progress]').forEach(r=>{r.oninput=e=>document.querySelector('[data-label="'+e.target.dataset.progress+'"]').textContent=e.target.value+'%';r.onchange=e=>save(e.target.dataset.progress,e.target.value)});
  document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>save(b.dataset.set,b.dataset.v))
}
function equipamentos(){
  document.querySelector('#app').innerHTML=`<section class="hero"><div class="hero-grid"><div><div class="eyebrow">ATIVOS TÉCNICOS</div><h2>Equipamentos dos clientes</h2><p>Histórico de máquinas, quadros e sistemas atendidos.</p></div><button class="btn primary" id="add">+ Equipamento</button></div></section><section class="panel"><div class="cards">${data.equipamentos.map(x=>{const c=data.clientes.find(a=>a.id===x.cliente_id);return `<article class="entity"><div class="entity-head"><div><b>⚙️ ${esc(x.nome)}</b><small>${esc(c?.nome_fantasia||'Sem cliente')} • ${esc(x.fabricante||'')} ${esc(x.modelo||'')}</small></div>${status(x.status)}</div><div class="entity-body"><div class="entity-grid"><div><span>Setor</span><b>${esc(x.setor||'—')}</b></div><div><span>Série</span><b>${esc(x.numero_serie||'—')}</b></div><div><span>Status</span><b>${esc(x.status)}</b></div></div></div></article>`}).join('')||'<div class="empty">Nenhum equipamento cadastrado.</div>'}</div></section>`;
  document.querySelector('#add').onclick=()=>{if(!data.clientes.length)return toast('Cadastre um cliente primeiro.',true);openForm('Novo equipamento',[['cliente_id','Cliente','select',data.clientes.map(x=>({value:x.id,label:x.nome_fantasia}))],['nome','Equipamento','text'],['fabricante','Fabricante','text'],['modelo','Modelo','text'],['numero_serie','Número de série','text'],['setor','Setor','text'],['status','Status','select',['Operacional','Em manutenção','Parado','Desativado']],['observacoes','Observações','textarea']],async v=>{const {error}=await supabase.from('ametec_equipamentos').insert(v);if(error)throw error})}
}
function materiais(){
  const total=data.materiais.reduce((s,x)=>s+(+x.quantidade||0)*(+x.valor_unitario||0),0);
  document.querySelector('#app').innerHTML=`<section class="hero"><div class="hero-grid"><div><div class="eyebrow">SUPRIMENTOS</div><h2>Materiais</h2><p>Itens vinculados aos serviços e compras técnicas.</p></div><button class="btn primary" id="add">+ Material</button></div></section><div class="metrics">${card('Itens',data.materiais.length)}${card('Comprados',data.materiais.filter(x=>x.comprado).length)}${card('Pendentes',data.materiais.filter(x=>!x.comprado).length)}${card('Valor registrado',money(total))}</div><section class="panel"><div class="cards">${data.materiais.map(x=>{const s=data.servicos.find(a=>a.id===x.servico_id);return `<article class="entity"><div class="entity-head"><div><b>📦 ${esc(x.descricao)}</b><small>${esc(s?.titulo||'Sem serviço')} • ${esc(x.fornecedor||'Sem fornecedor')}</small></div>${status(x.comprado?'Concluído':'Planejado')}</div><div class="entity-body"><div class="entity-grid"><div><span>Quantidade</span><b>${x.quantidade} ${esc(x.unidade||'')}</b></div><div><span>Unitário</span><b>${money(x.valor_unitario)}</b></div><div><span>Total</span><b>${money((+x.quantidade||0)*(+x.valor_unitario||0))}</b></div></div></div></article>`}).join('')||'<div class="empty">Nenhum material cadastrado.</div>'}</div></section>`;
  document.querySelector('#add').onclick=()=>{if(!data.servicos.length)return toast('Cadastre um serviço primeiro.',true);openForm('Novo material',[['servico_id','Serviço','select',data.servicos.map(x=>({value:x.id,label:x.titulo}))],['descricao','Material','text'],['quantidade','Quantidade','number'],['unidade','Unidade','text'],['valor_unitario','Valor unitário','number'],['fornecedor','Fornecedor','text'],['comprado','Comprado?','select',[{value:'false',label:'Não'},{value:'true',label:'Sim'}]]],async v=>{v.quantidade=+v.quantidade||1;v.valor_unitario=+v.valor_unitario||0;v.comprado=v.comprado==='true';const {error}=await supabase.from('ametec_materiais').insert(v);if(error)throw error})}
}
function colaboradores(){
  document.querySelector('#app').innerHTML=`<section class="hero"><div class="hero-grid"><div><div class="eyebrow">TIME TÉCNICO</div><h2>Colaboradores</h2><p>Equipe operacional, funções e disponibilidade.</p></div><button class="btn primary" id="add">+ Colaborador</button></div></section><section class="panel"><div class="cards">${data.colaboradores.map(x=>`<article class="entity"><div class="entity-head"><div><b>👷 ${esc(x.nome)}</b><small>${esc(x.funcao||'Sem função')} • ${esc(x.telefone||'Sem telefone')}</small></div>${status(x.ativo?'Ativo':'Inativo')}</div><div class="entity-body"><div class="entity-grid"><div><span>Pagamento</span><b>${esc(x.tipo_pagamento||'—')}</b></div><div><span>Valor base</span><b>${money(x.valor_base)}</b></div><div><span>Situação</span><b>${x.ativo?'Disponível':'Inativo'}</b></div></div></div></article>`).join('')||'<div class="empty">Nenhum colaborador cadastrado.</div>'}</div></section>`;
  document.querySelector('#add').onclick=()=>openForm('Novo colaborador',[['nome','Nome','text'],['funcao','Função','text'],['telefone','Telefone','text'],['tipo_pagamento','Pagamento','select',['diária','hora','mensal','valor fechado']],['valor_base','Valor base','number'],['ativo','Ativo?','select',[{value:'true',label:'Sim'},{value:'false',label:'Não'}]]],async v=>{v.valor_base=+v.valor_base||0;v.ativo=v.ativo==='true';const {error}=await supabase.from('ametec_colaboradores').insert(v);if(error)throw error})
}
function financeiro(){
  const total=data.servicos.reduce((s,x)=>s+(+x.valor_servico||0)+(+x.valor_material||0),0);
  const received=data.pagamentos.reduce((s,x)=>s+(+x.valor||0),0);
  const balance=Math.max(total-received,0);
  const overdue=data.servicos.reduce((s,x)=>{const p=paySummary(x);return s+(p.state==='Vencido'?p.balance:0)},0);
  document.querySelector('#app').innerHTML=`
    <section class="hero"><div class="hero-grid"><div><div class="eyebrow">CONTROLE FINANCEIRO</div><h2>Recebimentos AMETEC</h2><p>Acompanhe o que foi pago, quando foi pago e o que ainda falta receber.</p></div></div></section>
    <div class="metrics">${card('Faturado',money(total))}${card('Recebido',money(received))}${card('A receber',money(balance))}${card('Vencido',money(overdue))}</div>
    <section class="panel"><div class="panel-head"><div><h3>Serviços e recebimentos</h3><small>Histórico financeiro por atendimento</small></div></div><div class="cards">
      ${data.servicos.map(x=>{const c=data.clientes.find(a=>a.id===x.cliente_id),p=paySummary(x),pays=data.pagamentos.filter(a=>a.servico_id===x.id).sort((a,b)=>(b.data_pagamento||'').localeCompare(a.data_pagamento||''));const pc=p.state==='Pago'?'done':p.state==='Vencido'?'late':p.state==='Parcial'?'run':'';return `<article class="entity"><div class="entity-head"><div><b>${esc(x.titulo)}</b><small>${esc(c?.nome_fantasia||'Sem cliente')}</small></div><span class="status ${pc}">${p.state}</span></div><div class="entity-body"><div class="entity-grid"><div><span>Total</span><b>${money(p.total)}</b></div><div><span>Recebido</span><b>${money(p.received)}</b></div><div><span>Saldo</span><b>${money(p.balance)}</b></div></div>${pays.length?`<div style="display:grid;gap:5px"><small style="font-weight:800;color:#5f6f80">PAGAMENTOS</small>${pays.slice(0,4).map(pg=>`<div class="pending-line"><span>${date(pg.data_pagamento)} • ${esc(pg.forma_pagamento||'Não informado')}</span><b>${money(pg.valor)}</b></div>`).join('')}</div>`:'<small style="color:#82909f">Nenhum pagamento registrado.</small>'}<div class="actions"><button class="btn primary" data-fin-pay="${x.id}">+ Pagamento</button></div></div></article>`}).join('')||'<div class="empty">Sem serviços financeiros.</div>'}
    </div></section>`;
  document.querySelectorAll('[data-fin-pay]').forEach(b=>b.onclick=()=>{const x=data.servicos.find(s=>s.id===b.dataset.finPay);openForm('Registrar pagamento — '+x.titulo,[['data_pagamento','Data do pagamento','date'],['valor','Valor recebido','number'],['forma_pagamento','Forma de pagamento','select',['PIX','Dinheiro','Cartão','Transferência','Boleto','Outro']],['observacoes','Observações','textarea']],async v=>{v.valor=+v.valor||0;if(v.valor<=0)throw new Error('Informe um valor maior que zero.');v.servico_id=x.id;const {error}=await supabase.from('ametec_pagamentos').insert(v);if(error)throw error})})
}
function relatorios(){
  const total=data.servicos.length,done=data.servicos.filter(x=>x.status==='Concluído').length,em=data.servicos.filter(x=>x.status==='Em execução').length,urgent=data.servicos.filter(x=>x.prioridade==='Emergencial').length;
  document.querySelector('#app').innerHTML=`<section class="hero"><div class="hero-grid"><div><div class="eyebrow">INTELIGÊNCIA OPERACIONAL</div><h2>Relatórios AMETEC</h2><p>Indicadores para acompanhar produtividade e operação.</p></div><button class="btn secondary" id="csv">Exportar CSV</button></div></section><div class="metrics">${card('Serviços',total)}${card('Em execução',em)}${card('Concluídos',done)}${card('Emergenciais',urgent)}</div><div class="two"><section class="panel"><div class="panel-head"><div><h3>Status operacional</h3></div></div>${['Novo','Planejado','Em execução','Pausado','Concluído'].map(s=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #edf1f4"><span>${s}</span><b>${data.servicos.filter(x=>x.status===s).length}</b></div>`).join('')}</section><section class="panel"><div class="panel-head"><div><h3>Prioridades</h3></div></div>${['Emergencial','Alta','Média','Baixa'].map(s=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #edf1f4"><span>${s}</span><b>${data.servicos.filter(x=>x.prioridade===s).length}</b></div>`).join('')}</section></div>`;
  document.querySelector('#csv').onclick=()=>{const csv='Servico,Cliente,Tipo,Prioridade,Status,Progresso,ValorServico,ValorMaterial\n'+data.servicos.map(x=>{const c=data.clientes.find(a=>a.id===x.cliente_id);return [x.titulo,c?.nome_fantasia||'',x.tipo||'',x.prioridade,x.status,x.progresso,x.valor_servico,x.valor_material].map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')}).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='ametec-relatorio.csv';a.click()}
}
function bindCommon(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{page=b.dataset.go;render()});document.querySelectorAll('[data-new="servico"]').forEach(b=>b.onclick=newService)}
function placeholder(k,l){const m={nome_fantasia:'Ex.: Panificadora Central',contato:'Ex.: João',telefone:'Ex.: (85) 99999-9999',endereco:'Ex.: Fortaleza - CE',titulo:'Ex.: Manutenção no quadro principal',responsavel:'Ex.: Técnico responsável',descricao:'Descreva o diagnóstico, serviço ou observação',fabricante:'Ex.: WEG',modelo:'Ex.: CFW300',setor:'Ex.: Produção',fornecedor:'Ex.: Distribuidor elétrico',email:'Ex.: contato@empresa.com',setor:'Ex.: Manutenção',proxima_acao:'Ex.: Confirmar aprovação do orçamento',forma_pagamento:'Ex.: PIX'};return m[k]||('Digite '+String(l).toLowerCase())}
function openForm(title,fields,onSave,initial={}){
  document.querySelector('#modalTitle').textContent=title;const f=document.querySelector('#modalForm');
  f.innerHTML=fields.map(([k,l,t,o])=>{const val=initial?.[k]??'';if(t==='select')return '<label class="field"><span>'+l+'</span><select name="'+k+'">'+o.map(x=>{const vv=typeof x==='string'?x:x.value,ll=typeof x==='string'?x:x.label;return '<option value="'+esc(vv)+'" '+(String(vv)===String(val)?'selected':'')+'>'+esc(ll)+'</option>'}).join('')+'</select></label>';if(t==='textarea')return '<label class="field full"><span>'+l+'</span><textarea name="'+k+'" rows="3" placeholder="'+esc(placeholder(k,l))+'">'+esc(val)+'</textarea></label>';return '<label class="field"><span>'+l+'</span><input name="'+k+'" type="'+t+'" value="'+esc(val)+'" step="'+(t==='number'?'0.01':'any')+'" placeholder="'+esc(placeholder(k,l))+'"></label>'}).join('')+'<button class="btn primary" style="grid-column:1/-1">Salvar</button>';
  f.onsubmit=async e=>{e.preventDefault();try{await onSave(Object.fromEntries(new FormData(f)));closeModal();await load();toast('Salvo com sucesso!')}catch(err){toast(err.message||String(err),true)}};
  document.querySelector('#modal').classList.add('open')
}
window.closeModal=()=>document.querySelector('#modal').classList.remove('open');
initNav();
const {data:{session:initial}}=await supabase.auth.getSession();session=initial;
if(session){showApp();await load();subscribe()}else authScreen();
supabase.auth.onAuthStateChange(async(_,s)=>{session=s;if(session){showApp();await load();subscribe()}else{if(channel){supabase.removeChannel(channel);channel=null}authScreen()}});
</script>
</body>
