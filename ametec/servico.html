<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061923">
<title>AMETEC | Acompanhamento do serviço</title>
<style>
:root{--bg:#031018;--panel:#071923;--card:#091f2b;--line:#17384b;--text:#eefaff;--muted:#91adbd;--cyan:#28b9f0;--orange:#ffb600;--green:#38d996;--warn:#ffb347;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#020b10,#061722 70%,#071b27);color:var(--text)}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:linear-gradient(#1e8fc20b 1px,transparent 1px),linear-gradient(90deg,#1e8fc20b 1px,transparent 1px);background-size:30px 30px}
main{width:min(1120px,calc(100% - 28px));margin:0 auto;padding:28px 0 50px;position:relative}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}.brand-mark{width:46px;height:46px;border-radius:13px;background:linear-gradient(145deg,#ffb600,#ffd75a);color:#062c59;display:grid;place-items:center;font-weight:1000;font-size:20px}.brand b{display:block;font-size:19px;letter-spacing:.5px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.hero{background:linear-gradient(135deg,#071d29,#0b3448);border:1px solid #1b5069;border-radius:20px;padding:22px;display:grid;gap:16px}.eyebrow{font-size:10px;letter-spacing:1.6px;color:#78d5fb;font-weight:900}.hero h1{margin:3px 0 5px;font-size:28px;line-height:1.2}.hero p{margin:0;color:#a6c0cd;font-size:13px;line-height:1.5}.tags{display:flex;gap:7px;flex-wrap:wrap}.tag{border:1px solid #24566d;background:#0a2938;border-radius:999px;padding:6px 9px;font-size:10px;color:#cde9f4}
.progress-wrap{display:grid;gap:7px}.progress-head{display:flex;justify-content:space-between;gap:10px;font-size:12px}.progress{height:11px;background:#041018;border-radius:999px;overflow:hidden;border:1px solid #163444}.progress i{display:block;height:100%;background:linear-gradient(90deg,#1aa9e2,#38d996);border-radius:999px}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}.metric{background:#071923;border:1px solid var(--line);border-radius:13px;padding:13px}.metric span{display:block;font-size:9px;color:#7f9cab;text-transform:uppercase;letter-spacing:.04em}.metric b{display:block;font-size:16px;margin-top:4px;color:#fff}
.layout{display:grid;grid-template-columns:1.15fr .85fr;gap:12px;margin-top:12px}.stack{display:grid;gap:12px;align-content:start}.section{background:#071923;border:1px solid var(--line);border-radius:15px;padding:15px;display:grid;gap:11px}.section h2{margin:0;font-size:15px}.text{font-size:13px;line-height:1.65;color:#c4dbe5;white-space:pre-wrap}.rows{display:grid}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;padding:9px 0;border-bottom:1px solid #122d3b;font-size:12px}.row:last-child{border-bottom:0}.row span{color:#88a5b4}.row b{color:#fff;text-align:right}.addition{background:#06151d;border:1px solid #17384b;border-radius:10px;padding:11px;display:grid;gap:7px}.addition h3{margin:0;font-size:13px}.values{display:flex;gap:14px;flex-wrap:wrap;color:#9eb8c5;font-size:11px}.material{font-size:11px;color:#bfd6e1;padding:6px 0;border-bottom:1px solid #102a38}.material:last-child{border-bottom:0}.proposal-block{display:grid;gap:7px}.proposal-block h3{font-size:12px;margin:0;color:#dff6ff}.proposal-block p{margin:0;color:#b8d0dc;font-size:12px;line-height:1.6;white-space:pre-wrap}.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:7px 0;border-bottom:1px solid #122d3b;font-size:11px}.empty{color:#6f8997;font-size:12px;padding:10px 0}.loading,.error{min-height:50vh;display:grid;place-items:center;text-align:center;color:#9bb5c3}.error b{display:block;color:#fff;font-size:18px;margin-bottom:6px}
.footer{text-align:center;color:#607f8e;font-size:10px;margin-top:22px;padding-top:14px;border-top:1px solid #102b39}
@media(max-width:850px){.metrics{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.hero h1{font-size:23px}}
@media(max-width:520px){main{width:min(100% - 18px,1120px);padding-top:16px}.hero{padding:16px}.metrics{grid-template-columns:1fr 1fr}.metric b{font-size:14px}.row{font-size:11px}.brand b{font-size:17px}}
</style>
</head>
<body>
<main id="root">
  <div class="loading">Carregando acompanhamento do serviço...</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://dnvxvufknalpkkyttjcp.supabase.co';
const SUPABASE_KEY='sb_publishable_vuWxPsbP4CeHkekJkL-P6g_Jy3kOYcZ';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const root=document.querySelector('#root');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(+v||0);
const date=v=>{if(!v)return '—';const p=String(v).slice(0,10).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:'—'};
const row=(l,v)=>'<div class="row"><span>'+esc(l)+'</span><b>'+v+'</b></div>';
const token=new URLSearchParams(location.search).get('t');

function renderError(){
  root.innerHTML='<div class="error"><div><b>Link indisponível</b>Este compartilhamento não existe, expirou ou foi revogado.</div></div>';
}
function materialRows(items){
  return (items||[]).map(m=>'<div class="material">📦 '+esc(m.descricao)+' • '+esc(m.quantidade)+' '+esc(m.unidade||'un.')+' × '+money(m.valor_unitario)+'</div>').join('');
}
function render(d){
  const v=d.valores||{},datas=d.datas||{},eq=d.equipamento||null,p=d.proposta||null;
  const serviceTotal=(+v.servico_base||0)+(+v.servico_adicional||0);
  const materialRaw=(+v.material_base||0)+(+v.material_adicional_manual||0)+(+v.material_selecionado||0);
  const materialBillable=v.material_fornecimento==='Cliente compra'?0:materialRaw;
  const total=serviceTotal+materialBillable;
  const prog=Math.max(0,Math.min(100,+d.progresso||0));
  root.innerHTML=
  '<div class="brand"><div class="brand-mark">A</div><div><b>AMETEC</b><small>Manutenção Industrial e Elétrica</small></div></div>'+
  '<section class="hero"><div><div class="eyebrow">ACOMPANHAMENTO DO SERVIÇO</div><h1>'+esc(d.titulo)+'</h1><p>🏭 '+esc(d.cliente?.nome||'Cliente')+(d.tipo?' • '+esc(d.tipo):'')+(eq?' • ⚙️ '+esc(eq.nome||'Equipamento'):'')+'</p></div>'+
  '<div class="tags"><span class="tag">'+esc(d.status||'—')+'</span><span class="tag">Orçamento: '+esc(d.orcamento_status||'—')+'</span>'+(d.prioridade?'<span class="tag">Prioridade: '+esc(d.prioridade)+'</span>':'')+'</div>'+
  '<div class="progress-wrap"><div class="progress-head"><span>Progresso do serviço</span><b>'+prog+'%</b></div><div class="progress"><i style="width:'+prog+'%"></i></div></div></section>'+
  '<div class="metrics"><div class="metric"><span>Serviço</span><b>'+money(serviceTotal)+'</b></div><div class="metric"><span>Material</span><b>'+money(materialBillable)+'</b></div><div class="metric"><span>Total combinado</span><b>'+money(total)+'</b></div><div class="metric"><span>Previsão de entrega</span><b>'+date(datas.previsao_entrega)+'</b></div></div>'+
  '<div class="layout"><div class="stack">'+
    '<section class="section"><h2>Descrição do serviço</h2><div class="text">'+esc(d.descricao||'Nenhuma descrição cadastrada.')+'</div></section>'+
    '<section class="section"><h2>Informações do atendimento</h2><div class="rows">'+
      row('Responsável',esc(d.responsavel||'—'))+
      row('Próxima ação',esc(d.proxima_acao||'—'))+
      row('Situação do orçamento',esc(d.orcamento_status||'—'))+
      row('Equipamento',eq?esc([eq.nome,eq.fabricante,eq.modelo,eq.setor].filter(Boolean).join(' • ')):'—')+
    '</div></section>'+
    '<section class="section"><h2>Valores adicionais</h2>'+((d.adicionais||[]).length?(d.adicionais||[]).map(a=>'<div class="addition"><h3>'+esc(a.descricao||'Valor adicional')+'</h3><div class="values"><span>Serviço: <b>'+money(a.valor_servico)+'</b></span><span>Material: <b>'+money(a.valor_material)+'</b></span></div>'+materialRows(a.materiais)+'</div>').join(''):'<div class="empty">Nenhum valor adicional.</div>')+'</section>'+
    '<section class="section"><h2>Materiais adicionais</h2>'+((d.materiais||[]).length?materialRows(d.materiais):'<div class="empty">Nenhum material adicional informado.</div>')+'</section>'+
  '</div><div class="stack">'+
    '<section class="section"><h2>Datas</h2><div class="rows">'+
      row('Abertura',date(datas.abertura))+
      row('Orçamento enviado',date(datas.orcamento_envio))+
      row('Validade do orçamento',date(datas.orcamento_validade))+
      row('Agendamento',date(datas.agendamento)+(datas.horario_agendado?' • '+String(datas.horario_agendado).slice(0,5):''))+
      row('Início da execução',date(datas.inicio_execucao))+
      row('Previsão de entrega',date(datas.previsao_entrega))+
      row('Prazo da próxima ação',date(datas.proxima_acao))+
      row('Conclusão',date(datas.conclusao))+
    '</div></section>'+
    (p?'<section class="section"><h2>Proposta</h2>'+
      (p.objetivo?'<div class="proposal-block"><h3>Objetivo</h3><p>'+esc(p.objetivo)+'</p></div>':'')+
      (p.escopo?'<div class="proposal-block"><h3>Escopo</h3><p>'+esc(p.escopo)+'</p></div>':'')+
      ((p.itens||[]).length?'<div class="proposal-block"><h3>Itens</h3>'+(p.itens||[]).map(i=>'<div class="item"><span>'+esc(i.descricao)+' • '+esc(i.quantidade)+'x</span><b>'+money((+i.quantidade||0)*(+i.valor_unitario||0))+'</b></div>').join('')+'</div>':'')+
      (p.condicao_inicio?'<div class="proposal-block"><h3>Para iniciar</h3><p>'+esc(p.condicao_inicio)+'</p></div>':'')+
      (p.condicao_conclusao?'<div class="proposal-block"><h3>Na conclusão</h3><p>'+esc(p.condicao_conclusao)+'</p></div>':'')+
      (p.prazo_estimado?'<div class="proposal-block"><h3>Prazo estimado</h3><p>'+esc(p.prazo_estimado)+'</p></div>':'')+
      (p.garantia?'<div class="proposal-block"><h3>Garantia</h3><p>'+esc(p.garantia)+'</p></div>':'')+
      (p.observacoes?'<div class="proposal-block"><h3>Observações</h3><p>'+esc(p.observacoes)+'</p></div>':'')+
    '</section>':'')+
  '</div></div>'+
  '<div class="footer">Página de acompanhamento compartilhada pela AMETEC. Este link dá acesso somente a este serviço.</div>';
}
(async()=>{
  if(!token)return renderError();
  const {data,error}=await db.rpc('get_ametec_servico_publico',{p_token:token});
  if(error||!data)return renderError();
  render(data);
})();
</script>
</body>
</html>
